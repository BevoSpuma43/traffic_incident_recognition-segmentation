project:
  root_dir: ..
  seed: 42
  output_dir: outputs
video:
  source: data/samples/demo.mp4
  target_fps: 8
  queue_size: 2
perception:
  model: models/yolo26n-seg.pt
  backend: pytorch
  device: cpu
  confidence: 0.1
  image_size: 640
  classes: [car, truck, bus, motorcycle]
calibration:
  camera_id: camera_01
  file: data/calibration/camera_01.yaml
  detect_camera_motion: true
